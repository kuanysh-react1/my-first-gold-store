<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Золото Александрия - Калькулятор</title>
<style>
body { background: #111; color: gold; font-family: sans-serif; padding: 20px; text-align: center; }
.box { background: #222; padding: 20px; border-radius: 15px; max-width: 400px; margin: 20px auto; border: 2px solid gold; }
input { width: 80%; padding: 10px; margin: 10px; border-radius: 8px; border: none; font-size: 18px; text-align: center; }
button { background: gold; color: black; padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }
#result { font-size: 28px; margin-top: 15px; color: white; }
</style>
</head>
<body>
<h1>✨ Магазин золота в Александрии</h1>
<p>Куаныш - React разработчик</p>

<div class="box">
<h2>Калькулятор 21 карат</h2>
<p>Вес в граммах:</p>
<input type="number" id="grams" placeholder="например 10">
<p>Цена за грамм (EGP):</p>
<input type="number" id="price" value="4600">
<br>
<button onclick="calc()">Посчитать цену</button>
<div id="result"></div>
</div>

<script>
function calc() {
  let g = document.getElementById('grams').value;
  let p = document.getElementById('price').value;
  let total = g * p;
  document.getElementById('result').innerHTML = "Цена: " + total + " EGP";
}
</script>
</body>
</html>
