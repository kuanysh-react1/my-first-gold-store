<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIPP KZ</title>
<style>
body{font-family:Inter,sans-serif;background:#fff;color:#111;margin:0}
header{background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:28px} .logo span{color:#C6FF00}
.post{background:#C6FF00;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.container{max-width:1000px;margin:auto;padding:12px}
.search{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;background:#f5f5f5;box-sizing:border-box;font-size:16px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}
.chip{border:1px solid #ddd;padding:8px 16px;border-radius:20px;white-space:nowrap;cursor:pointer;background:#fff;font-size:14px}
.chip.active{background:#111;color:#fff}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{border:1px solid #eee;border-radius:16px;overflow:hidden;background:#fff}
.card img{width:100%;height:170px;object-fit:cover}
.info{padding:10px}
.price{font-weight:900}
.city{color:#888;font-size:12px}
.add{background:#f6f6f6;padding:16px;border-radius:16px;margin-top:24px}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="logo">FLI<span>PP</span> <span style="font-size:12px;color:#fff;font-weight:400;letter-spacing:2px">KZ</span></div><button class="post" onclick="add.scrollIntoView()">+ ПРОДАТЬ</button></header>
<div class="container">
<input id="q" class="search" placeholder="🔍 Что ищем? iPhone, квартира, Camry" oninput="render()">
<div class="chips">
<div class="chip active" onclick="filterCat('Все',this)">Все</div>
<div class="chip" onclick="filterCat('Техника',this)">Техника</div>
<div class="chip" onclick="filterCat('Авто',this)">Авто</div>
<div class="chip" onclick="filterCat('Квартиры',this)">Квартиры</div>
<div class="chip" onclick="filterCat('Работа',this)">Работа</div>
<div class="chip" onclick="filterCat('Одежда',this)">Одежда</div>
</div>

<div id="list" class="cards"></div>

<div id="add" class="add">
<h3>Залить объявление на FLIPP</h3>
<input id="title" placeholder="Название: iPhone 15 Pro Алматы">
<input id="price" type="number" placeholder="Цена в KZT">
<select id="cat"><option>Техника</option><option>Авто</option><option>Квартиры</option><option>Работа</option><option>Одежда</option><option>Другое</option></select>
<select id="city"><option>Алматы</option><option>Астана</option><option>Шымкент</option><option>Караганда</option><option>Актобе</option><option>Тараз</option></select>
<input id="img" placeholder="Ссылка на фото">
<input id="phone" placeholder="WhatsApp номер">
<button class="post" style="width:100%;margin-top:8px" onclick="addAd()">FLIPP IT 🚀</button>
</div>
</div>

<script>
let curCat='Все';
let ads=JSON.parse(localStorage.getItem('flipp_kz_v2')||'[]');
if(!ads.length)ads=[
{title:'iPhone 15 Pro 256GB',price:550000,cat:'Техника',city:'Алматы',img:'https://images.unsplash.com/photo-1592899677977-9c10ca588bbd'},
{title:'Toyota Camry 70 2022',price:12500000,cat:'Авто',city:'Астана',img:'https://images.unsplash.com/photo-1550355291-bbee04a92027'},
{title:'1-комн. квартира Самал-2',price:25000000,cat:'Квартиры',city:'Алматы',img:'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2'},
{title:'Nike Air Max новые',price:45000,cat:'Одежда',city:'Шымкент',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff'}
];
function filterCat(c,el){curCat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let html='';
 ads.filter(a=>(curCat=='Все'||a.cat==curCat) && a.title.toLowerCase().includes(q)).forEach(a=>{
  html+=`<div class="card"><img src="${a.img}"><div class="info"><div class="price">${a.price.toLocaleString()} ₸</div><div style="font-size:13px">${a.title}</div><div class="city">📍 ${a.city} • ${a.cat}</div></div></div>`;
 });
 list.innerHTML=html;
}
function addAd(){
 let t=title.value,p=price.value;if(!t||!p)return alert('Название и цена!');
 ads.unshift({title:t,price:+p,cat:cat.value,city:city.value,img:img.value||'https://via.placeholder.com/300',phone:phone.value});
 localStorage.setItem('flipp_kz_v2',JSON.stringify(ads));
 render();title.value='';price.value='';alert('Залили! Твое объявление сверху');
}
render();
</script>
</body>
                                                                                                                                                              </html>
