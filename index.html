<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIPP KZ</title>
<style>
body{font-family:Inter,sans-serif;background:#111;color:#fff;margin:0}
header{background:#111;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:28px} .logo span{color:#C6FF00}
.post{background:#C6FF00;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.container{max-width:1000px;margin:auto;padding:12px}
.search{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}
.chip{border:1px solid #333;padding:8px 16px;border-radius:20px;white-space:nowrap;cursor:pointer;background:#222}
.chip.active{background:#C6FF00;color:#000}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid #222;border-radius:16px;overflow:hidden;background:#161616;position:relative;cursor:pointer}
.card img{width:100%;height:170px;object-fit:cover}
.info{padding:10px}
.price{font-weight:900;color:#C6FF00}
.city{color:#888;font-size:12px}
.add{background:#161616;padding:16px;border-radius:16px;margin-top:24px;border:1px solid #222}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
/* МОДАЛКА */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;display:none;overflow:auto}
.modal-content{background:#161616;max-width:600px;margin:20px auto;border-radius:20px;overflow:hidden;border:1px solid #333}
.modal img{width:100%;height:350px;object-fit:cover}
.modal-body{padding:20px}
.modal-price{font-size:28px;font-weight:900;color:#C6FF00}
.modal-title{font-size:20px;font-weight:700;margin:10px 0}
.modal-desc{color:#ccc;line-height:1.6;margin:15px 0;white-space:pre-wrap}
.close{position:absolute;top:15px;right:15px;background:#222;color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.btns{display:flex;gap:10px;margin-top:20px}
.btn-wa{flex:1;background:#25D366;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
.btn-call{flex:1;background:#C6FF00;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">FLI<span>PP</span> KZ</div><button class="post" onclick="document.getElementById('add').scrollIntoView()">+ ПРОДАТЬ</button></header>
<div class="container">
<input id="q" class="search" placeholder="🔍 Что ищем?" oninput="render()">
<div class="chips">
<div class="chip active" onclick="filterCat('Все',this)">Все</div>
<div class="chip" onclick="filterCat('Техника',this)">Техника</div>
<div class="chip" onclick="filterCat('Авто',this)">Авто</div>
<div class="chip" onclick="filterCat('Квартиры',this)">Квартиры</div>
<div class="chip" onclick="filterCat('Одежда',this)">Одежда</div>
</div>
<div id="list" class="cards"></div>
<div id="add" class="add">
<h3>Залить объявление</h3>
<input id="title" placeholder="Название">
<input id="price" type="number" placeholder="Цена в KZT">
<input id="phone" placeholder="WhatsApp номер: 77001234567">
<select id="cat"><option>Техника</option><option>Авто</option><option>Квартиры</option><option>Одежда</option><option>Другое</option></select>
<select id="city"><option>Алматы</option><option>Астана</option><option>Шымкент</option><option>Костанай</option><option>Караганда</option></select>
<input id="img" placeholder="Ссылка на фото">
<textarea id="desc" rows="4" placeholder="Описание: состояние, торг, доставка, адрес..."></textarea>
<button class="post" style="width:100%" onclick="addAd()">FLIPP IT 🚀</button>
</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
<div class="modal-content" onclick="event.stopPropagation()" style="position:relative">
<button class="close" onclick="closeModal()">✕</button>
<img id="mImg" src="">
<div class="modal-body">
<div id="mPrice" class="modal-price"></div>
<div id="mTitle" class="modal-title"></div>
<div id="mCity" class="city"></div>
<div id="mDesc" class="modal-desc"></div>
<div class="btns">
<button id="mWa" class="btn-wa">WhatsApp</button>
<button id="mCall" class="btn-call">Позвонить</button>
</div>
</div>
</div>
</div>

<script>
let curCat='Все';
let ads=JSON.parse(localStorage.getItem('flipp_kz_v3')||'[]');
if(!ads.length)ads=[
{title:'iPhone 15 Pro 256GB',price:550000,cat:'Техника',city:'Алматы',img:'https://images.unsplash.com/photo-1592899677977-9c10ca588bbd',desc:'Состояние идеальное, как новый. Коробка, чек, гарантия до 2025. Батарея 98%. Торг уместен. Доставка по Алматы.',phone:'77001234567'},
{title:'Toyota Camry 70 2022',price:12500000,cat:'Авто',city:'Астана',img:'https://images.unsplash.com/photo-1550355291-bbee04a92027',desc:'2.5 л, 10 000 км пробег, родная краска, один хозяин. Полный фарш, люк, кожа. Растаможена в КЗ.',phone:'77001234567'},
{title:'1-комн. квартира Самал-2',price:25000000,cat:'Квартиры',city:'Алматы',img:'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2',desc:'40 кв.м, 5/9 этаж, ремонт, мебель, техника. Рядом школа, детсад, Магнум. Документы чистые.',phone:'77001234567'},
{title:'Nike Air Max новые',price:45000,cat:'Одежда',city:'Шымкент',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff',desc:'Оригинал, размер 42, новые в коробке. Привез из Дубая. Чек есть.',phone:'77001234567'}
];
function filterCat(c,el){curCat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let html='';
 ads.filter(a=>(curCat=='Все'||a.cat==curCat) && a.title.toLowerCase().includes(q)).forEach((a)=>{
  let i=ads.indexOf(a);
  html+=`<div class="card"><button onclick="event.stopPropagation();delAd(${i})" style="position:absolute;top:8px;right:8px;background:#ff4444;color:#fff;border:none;border-radius:50%;width:28px;height:28px;z-index:2">✕</button><div onclick="openAd(${i})"><img src="${a.img}"><div class="info"><div class="price">${a.price.toLocaleString()} ₸</div><div style="font-size:13px">${a.title}</div><div class="city">📍 ${a.city}</div></div></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
function openAd(i){
 let a=ads[i];
 document.getElementById('mImg').src=a.img;
 document.getElementById('mPrice').innerText=a.price.toLocaleString()+' ₸';
 document.getElementById('mTitle').innerText=a.title;
 document.getElementById('mCity').innerText='📍 '+a.city+' • '+a.cat;
 document.getElementById('mDesc').innerText=a.desc||'Описания нет';
 document.getElementById('mWa').onclick=()=>window.open('https://wa.me/'+(a.phone||'77001234567'));
 document.getElementById('mCall').onclick=()=>window.open('tel:+'+(a.phone||'77001234567'));
 document.getElementById('modal').style.display='block';
}
function closeModal(){document.getElementById('modal').style.display='none';}
function delAd(i){if(confirm('Удалить?')){ads.splice(i,1);localStorage.setItem('flipp_kz_v3',JSON.stringify(ads));render();}}
function addAd(){
 let t=title.value,p=price.value;if(!t||!p)return alert('Заполни!');
 ads.unshift({title:t,price:+p,cat:cat.value,city:city.value,img:img.value||'https://via.placeholder.com/300',desc:desc.value,phone:phone.value});
 localStorage.setItem('flipp_kz_v3',JSON.stringify(ads));render();
 title.value='';price.value='';desc.value='';img.value='';phone.value='';alert('Готово!');
}
render();
</script>
</body>
</html>
